<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <link rel="stylesheet" href="timeline.css">
  <title>Group — AnonChat</title>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="timeline.html">AnonChat</a>
    <div class="topbar-actions">
      <a class="secondary-button" href="groups.html">Groups</a>
      <button id="group-detail-sign-out" class="secondary-button" type="button">Sign Out</button>
    </div>
  </header>

  <main class="page-shell">
    <header class="connections-heading">
      <p class="eyebrow">Group</p>
      <h1 id="group-detail-title">Loading Group…</h1>
      <p id="group-detail-description"></p>
      <p id="group-detail-members"></p>
      <p id="group-detail-role"></p>
      <button id="group-detail-membership" type="button" hidden>Join</button>
      <p id="group-detail-status" role="status" aria-live="polite"></p>
    </header>

    <section class="connections-panel" aria-labelledby="group-discussion-title">
      <h2 id="group-discussion-title">Discussion</h2>
      <form id="group-post-composer" hidden>
        <label for="group-post-content">Post</label>
        <textarea id="group-post-content" maxlength="500" required placeholder="Start a discussion"></textarea>
        <label for="group-post-kind">Type</label>
        <select id="group-post-kind">
          <option value="Question">Post</option>
          <option value="Poll">Poll</option>
        </select>
        <div id="group-poll-options" hidden>
          <label>Poll options</label>
          <input data-group-poll-option maxlength="120" placeholder="Option 1">
          <input data-group-poll-option maxlength="120" placeholder="Option 2">
          <input data-group-poll-option maxlength="120" placeholder="Option 3">
          <input data-group-poll-option maxlength="120" placeholder="Option 4">
        </div>
        <button type="submit">Post</button>
      </form>
      <div id="group-posts-list" class="connections-list" aria-live="polite"></div>
    </section>
  </main>

  <script type="module" src="group-detail.js"></script>
</body>
</html>
