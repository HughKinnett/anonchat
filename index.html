<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <meta name="description" content="Share pseudonymous posts and reactions on AnonChat.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="AnonChat">
  <meta name="format-detection" content="telephone=no">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="Untitled.jpeg">
  <link rel="stylesheet" href="login.css">
  <title>AnonChat — Sign in</title>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="AnonChat home">AnonChat</a>
    <button class="install-app" type="button">Install app</button>
  </header>

  <main class="auth-shell">
    <section class="intro" aria-labelledby="welcome-title">
      <p class="eyebrow">Say it without saying who you are</p>
      <h1 id="welcome-title">Your thoughts.<br>Your anonymous handle.</h1>
      <p>Post under a pseudonym, react honestly, and keep your email private from other users.</p>
    </section>

    <div class="auth-panels">
      <section class="auth-card" aria-labelledby="sign-in-title">
        <h2 id="sign-in-title">Welcome back</h2>
        <p>Sign in to see the timeline.</p>
        <form id="sign-in-form">
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="you@example.com" autocomplete="email" required>
          <label for="password">Password</label>
          <input id="password" type="password" placeholder="Your password" autocomplete="current-password" required>
          <button class="primary-button" id="submit" type="submit">Sign In</button>
          <button class="forgot-password" id="forgot-password" type="button">Forgot password?</button>
        </form>
      </section>

      <section class="auth-card" aria-labelledby="sign-up-title">
        <h2 id="sign-up-title">Create an account</h2>
        <p>Choose a handle that does not identify you.</p>
        <form id="sign-up-form">
          <label for="username">Anonymous username</label>
          <input id="username" type="text" placeholder="hidden_voice" autocomplete="username" minlength="3" maxlength="30" required>
          <label for="sign-up-email">Email</label>
          <input id="sign-up-email" type="email" placeholder="you@example.com" autocomplete="email" required>
          <label for="sign-up-password">Password</label>
          <input id="sign-up-password" type="password" placeholder="At least 8 characters" autocomplete="new-password" minlength="8" required>
          <button class="primary-button" id="sign-up" type="submit">Create Account</button>
        </form>
      </section>
    </div>

    <p id="auth-status" role="status" aria-live="polite"></p>
    <p class="install-help" role="status" aria-live="polite"></p>
  </main>

  <script type="module" src="loginfirebase.js"></script>
  <script src="pwa.js" defer></script>
</body>
</html>
