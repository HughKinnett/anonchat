name: Apply Phase B persistence integration

on:
  push:
    branches:
      - phase-b-content-discovery
    paths:
      - scripts/apply-phase-b-persistence.mjs
      - scripts/fix-phase-b-persistence-anchor.mjs
      - .github/workflows/apply-phase-b-persistence.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-b-content-discovery
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/fix-phase-b-persistence-anchor.mjs
      - name: Diagnose repost anchor
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const timeline = fs.readFileSync("timeline.js", "utf8");
          const patch = fs.readFileSync("scripts/apply-phase-b-persistence.mjs", "utf8");
          const needle = `    imageData: post.imageData || "",
              createdAt: serverTimestamp()`;
          const index = timeline.indexOf('imageData: post.imageData || ""');
          console.log("timeline needle present:", timeline.includes(needle));
          console.log("timeline snippet:", JSON.stringify(timeline.slice(Math.max(0, index - 24), index + 110)));
          const patchIndex = patch.indexOf("repost media preservation");
          console.log("patch snippet:", JSON.stringify(patch.slice(Math.max(0, patchIndex - 260), patchIndex + 40)));
          NODE
      - run: node scripts/apply-phase-b-persistence.mjs
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No patch changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add timeline.js scripts/apply-phase-b-persistence.mjs
          git commit -m "feat: persist Phase B private state and media"
          git push origin HEAD:phase-b-content-discovery
