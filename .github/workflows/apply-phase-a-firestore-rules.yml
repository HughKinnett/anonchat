name: Apply Phase A Firestore rules patch

on:
  push:
    branches:
      - phase-a-profiles-identity
    paths:
      - scripts/apply-phase-a-firestore-rules.mjs
      - .github/workflows/apply-phase-a-firestore-rules.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-a-profiles-identity
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/apply-phase-a-firestore-rules.mjs
      - name: Commit materialized rule changes
        run: |
          if git diff --quiet -- firestore.rules; then
            echo "No rule changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firestore.rules
          git commit -m "feat: secure phase A profile settings"
          git push origin HEAD:phase-a-profiles-identity
