name: Diagnose registration flag

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Read production registration flag as logged-out client
        run: |
          node --input-type=module <<'EOF'
          import { initializeApp } from 'firebase/app';
          import { getFirestore, doc, getDoc } from 'firebase/firestore';
          const app = initializeApp({
            apiKey: 'AIzaSyAyIEUtkZMQwjfDuml46HslThXpnbXilEk',
            authDomain: 'anonchatlogin.firebaseapp.com',
            projectId: 'anonchatlogin',
            storageBucket: 'anonchatlogin.appspot.com',
            messagingSenderId: '734396560776',
            appId: '1:734396560776:web:49cb149c173633d77ab63d'
          });
          const snap = await getDoc(doc(getFirestore(app), 'siteSettings', 'features'));
          console.log('exists=' + snap.exists());
          console.log('registrationsEnabled=' + String(snap.data()?.registrationsEnabled));
          if (!snap.exists()) process.exit(2);
          if (snap.data()?.registrationsEnabled !== true) process.exit(3);
          EOF
      - name: Remove diagnostic workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/diagnose-registration-flag.yml
          git commit -m "Remove registration flag diagnostic" || true
          git push origin HEAD:main || true
