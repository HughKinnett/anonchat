name: Fix registration toggle

on:
  push:
    paths:
      - .github/workflows/fix-registration-toggle.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Add registration regression test
        shell: bash
        run: |
          cat > scripts/test-registration-toggle-regression.mjs <<'EOF'
          import { assertFails, assertSucceeds, initializeTestEnvironment } from "@firebase/rules-unit-testing";
          import { doc, serverTimestamp, setDoc, writeBatch } from "firebase/firestore";
          import { readFile } from "node:fs/promises";

          const env = await initializeTestEnvironment({
            projectId: "anonchat-registration-toggle-test",
            firestore: { rules: await readFile(new URL("../firestore.rules", import.meta.url), "utf8") }
          });

          const seed = async enabled => env.withSecurityRulesDisabled(async context => {
            const db = context.firestore();
            await setDoc(doc(db, "siteSettings", "features"), { registrationsEnabled: enabled });
            await setDoc(doc(db, "system", "accountStats"), { count: 5, limit: 500, updatedAt: new Date(0) });
          });

          const signup = async (uid, username) => {
            const db = env.authenticatedContext(uid, { email_verified: false }).firestore();
            const batch = writeBatch(db);
            batch.set(doc(db, "usernames", username.toLowerCase()), { uid, username, createdAt: serverTimestamp() });
            batch.set(doc(db, "users", uid), { uid, username, createdAt: serverTimestamp(), lastActiveAt: serverTimestamp() });
            batch.update(doc(db, "system", "accountStats"), { count: 6, limit: 500, updatedAt: serverTimestamp() });
            return batch.commit();
          };

          try {
            await seed(true);
            await assertSucceeds(signup("new-user", "New_User"));
            await env.clearFirestore();
            await seed(false);
            await assertFails(signup("blocked-user", "Blocked_User"));
            console.log("registration toggle regression passed");
          } finally {
            await env.cleanup();
          }
          EOF
      - name: Reproduce current failure
        shell: bash
        run: |
          if npx firebase emulators:exec --only firestore "node scripts/test-registration-toggle-regression.mjs"; then
            echo "Expected the regression test to fail before the fix, but it passed."
            exit 1
          else
            echo "Confirmed: enabled registrations fail for a normal newly-created unverified email/password user."
          fi
      - name: Fix signed-in rule to match actual authentication flow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('firestore.rules')
          text = path.read_text()
          old = "return request.auth != null && request.auth.token.email_verified == true;"
          new = "return request.auth != null;"
          if old not in text:
              raise SystemExit('expected signedIn rule not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Verify registration toggle behavior
        run: npx firebase emulators:exec --only firestore "node scripts/test-registration-toggle-regression.mjs"
      - name: Verify core tests
        run: npm test
      - name: Commit fix and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-registration-toggle.yml
          git add firestore.rules scripts/test-registration-toggle-regression.mjs
          git commit -m "Fix new registration toggle signup flow"
          git push origin HEAD:main
