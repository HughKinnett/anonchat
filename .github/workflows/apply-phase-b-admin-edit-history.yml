name: Apply Phase B admin edit history

on:
  push:
    branches:
      - phase-b-content-discovery
    paths:
      - scripts/apply-phase-b-admin-edit-history.mjs
      - .github/workflows/apply-phase-b-admin-edit-history.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-b-content-discovery
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/apply-phase-b-admin-edit-history.mjs
      - run: node scripts/test-phase-b-admin-edit-history.mjs
      - run: node --check admin.js
      - name: Commit admin edit-history viewer
        run: |
          if git diff --quiet; then
            echo "No admin history changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.js
          git commit -m "feat: add admin Phase B edit-history viewer"
          git push origin HEAD:phase-b-content-discovery
