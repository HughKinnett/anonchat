name: UX expansion check
on:
  push:
    branches: [feature/user-experience-expansion]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/test-user-experience-expansion.mjs
