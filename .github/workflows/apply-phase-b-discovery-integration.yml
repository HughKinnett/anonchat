name: Apply Phase B discovery integration

on:
  push:
    branches:
      - phase-b-content-discovery
    paths:
      - scripts/apply-phase-b-discovery-integration.mjs
      - .github/workflows/apply-phase-b-discovery-integration.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-b-content-discovery
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/apply-phase-b-discovery-integration.mjs
      - run: node scripts/test-phase-b-discovery-integration.mjs
      - run: node scripts/test-hashtag-discovery-policy.mjs
      - run: node scripts/test-suggested-follow-policy.mjs
      - run: node --check timeline.js
      - name: Commit discovery integration
        run: |
          if git diff --quiet; then
            echo "No discovery changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add timeline.js
          git commit -m "feat: complete Phase B discovery candidate signals"
          git push origin HEAD:phase-b-content-discovery
