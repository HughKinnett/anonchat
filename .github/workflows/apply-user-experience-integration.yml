name: Apply user experience integration
on:
  push:
    branches: [feature/user-experience-expansion]
    paths:
      - scripts/apply-user-experience-integration.mjs
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/user-experience-expansion
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/apply-user-experience-integration.mjs
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: integrate user experience expansion"
          git push origin HEAD:feature/user-experience-expansion
