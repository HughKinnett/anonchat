name: Personalized discovery CI

on:
  push:
    branches:
      - feature/personalized-discovery-ranking

permissions:
  contents: read

jobs:
  policy-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/test-suggested-follow-policy.mjs
      - run: node scripts/test-feed-ranking-policy.mjs
      - run: node scripts/test-hashtag-discovery-policy.mjs
