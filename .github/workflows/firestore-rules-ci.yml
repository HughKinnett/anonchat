name: Firestore rules CI

on:
  pull_request:
    paths:
      - firestore.rules
      - firestore.indexes.json
      - firebase.json
      - package.json
      - package-lock.json
      - .github/workflows/firestore-rules-ci.yml
      - .github/workflows/process-admin-deletions.yml
      - .github/workflows/process-notifications.yml
      - workflow-policy.mjs
      - notification-*.mjs
      - push-config.mjs
      - sw.js
      - timeline.js
      - community.js
      - scripts/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - run: npm ci
      - run: npm run test:workflow-policy
      - run: npm run test:firestore-ci
