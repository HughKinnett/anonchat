name: Firestore rules CI

on:
  pull_request:
    paths:
      - firestore.rules
      - firestore.indexes.json
      - firebase.json
      - package.json
      - package-lock.json
      - .github/workflows/**
      - "*.js"
      - "*.mjs"
      - "*.html"
      - "*.css"
      - "*.webmanifest"
      - scripts/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - run: npm ci
      - name: Harden retired feature and badge rules
        run: node scripts/apply-retired-feature-rules-hardening.mjs
      - run: npm run test:workflow-policy
      - run: npm run test:firestore-ci
