name: Apply admin rule budget fix
on:
  push:
    branches:
      - feature/simplified-admin-command-center
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/simplified-admin-command-center
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply suspension rule fix
        run: node scripts/fix-admin-rule-budget.mjs
      - name: Commit fix
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firestore.rules admin.js scripts/test-admin-expanded-controls.mjs
          git commit -m "fix: enforce suspensions without extra rule lookup"
          git push origin HEAD:feature/simplified-admin-command-center
