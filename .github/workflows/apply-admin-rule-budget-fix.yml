name: Apply admin site controls
on:
  push:
    branches:
      - feature/simplified-admin-command-center
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/simplified-admin-command-center
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply admin control patches
        run: |
          node scripts/fix-admin-rule-budget.mjs
          node scripts/apply-admin-site-controls.mjs
      - name: Commit controls
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firestore.rules admin.js loginfirebase.js premium-playlist.js site-announcement.js sw.js index.html timeline.html profile.html community.html premium.html premium-playlist.html delete-account.html docs/superpowers/specs/2026-09-04-simplified-admin-command-center-design.md scripts/test-admin-expanded-controls.mjs
          git commit -m "feat: enforce admin controls across the site"
          git push origin HEAD:feature/simplified-admin-command-center
