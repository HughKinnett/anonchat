name: Diagnose push auth baseline

on:
  push:
    branches:
      - feature/personalized-discovery-ranking
    paths:
      - '.github/workflows/diagnose-push-auth-baseline.yml'

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-copy
      - name: Checkout feature
        uses: actions/checkout@v4
        with:
          ref: feature/personalized-discovery-ranking
          path: feature-copy
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test main baseline
        working-directory: main-copy
        run: node scripts/test-push-auth-integration.mjs
        continue-on-error: true
      - name: Test feature branch
        working-directory: feature-copy
        run: node scripts/test-push-auth-integration.mjs
        continue-on-error: true
      - name: Record exact exit codes
        shell: bash
        run: |
          set +e
          (cd main-copy && node scripts/test-push-auth-integration.mjs)
          MAIN_STATUS=$?
          (cd feature-copy && node scripts/test-push-auth-integration.mjs)
          FEATURE_STATUS=$?
          echo "main_status=$MAIN_STATUS"
          echo "feature_status=$FEATURE_STATUS"
          if [ "$MAIN_STATUS" -ne "$FEATURE_STATUS" ]; then
            echo "Baseline differs from feature branch"
            exit 1
          fi
          if [ "$MAIN_STATUS" -eq 0 ]; then
            echo "Both pass"
          else
            echo "Both fail identically at the test level"
          fi
