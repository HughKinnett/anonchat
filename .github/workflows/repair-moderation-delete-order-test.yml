name: Repair moderation deletion order regression

on:
  push:
    branches:
      - fix/e2ee-spotify-privacy
    paths:
      - scripts/repair-moderation-delete-order-test.mjs
      - .github/workflows/repair-moderation-delete-order-test.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/e2ee-spotify-privacy
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repair moderation deletion order
        run: node scripts/repair-moderation-delete-order-test.mjs
      - name: Validate patch
        run: |
          git diff --check
          git diff -- scripts/test-moderation-rules.mjs
      - name: Commit repaired test
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/test-moderation-rules.mjs
          git commit -m "test: preserve both admin deletion paths"
          git push origin HEAD:fix/e2ee-spotify-privacy
