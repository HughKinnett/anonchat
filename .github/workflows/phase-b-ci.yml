name: Phase B focused CI

on:
  push:
    branches:
      - phase-b-content-discovery
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/test-content-edit-policy.mjs
