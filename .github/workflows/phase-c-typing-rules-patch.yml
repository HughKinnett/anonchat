name: Phase C typing rules patch

on:
  push:
    branches: [phase-c-inline-implementation]
    paths: [.phase-c-typing-rules-trigger]

permissions:
  contents: write

jobs:
  patch-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-c-inline-implementation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-phase-c-typing-rules.mjs
      - name: Commit patched rules
        run: |
          if git diff --quiet -- firestore.rules; then
            echo "No rule changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firestore.rules
          git commit -m "feat: allow participant-only private typing state"
          git push origin HEAD:phase-c-inline-implementation
