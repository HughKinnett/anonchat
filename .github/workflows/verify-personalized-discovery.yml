name: Verify personalized discovery implementation

on:
  push:
    branches:
      - feature/personalized-discovery-ranking
    paths:
      - '.github/workflows/verify-personalized-discovery.yml'

permissions:
  contents: read

jobs:
  focused-and-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: node scripts/test-suggested-follow-policy.mjs
      - run: node scripts/test-feed-ranking-policy.mjs
      - run: node scripts/test-hashtag-discovery-policy.mjs
      - run: node scripts/test-timeline-recommendation-context.mjs
      - run: node scripts/test-phase-b-ui.mjs
      - run: node scripts/test-feed-mode-policy.mjs
      - run: node scripts/test-phase-b-package.mjs
      - run: node scripts/test-phase-b-listener-order.mjs
      - run: node scripts/test-phase-b-reference-loading.mjs
      - run: node scripts/test-phase-b-discovery-integration.mjs
      - run: node scripts/test-push-service-worker.mjs
      - run: node --check timeline.js
      - run: npm run test:firestore-ci
      # Re-run marker after behavioral discovery integration contract update.
