name: Discovery and Feed focused CI

on:
  push:
    branches:
      - growth-web-release
      - mobile-topics-hotfix-tests
      - mobile-topics-hotfix
      - remove-saved-filters-hotfix
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/test-feed-mode-policy.mjs
      - run: node scripts/test-feed-ranking-policy.mjs
      - run: node scripts/test-feed-controls-surface.mjs
      - run: node scripts/test-topic-policy.mjs
      - run: node scripts/test-content-writer-topics.mjs
      - run: node scripts/test-chosen-topics-feed.mjs
      - run: node scripts/test-mobile-hashtag-topic-surface.mjs
      - run: node scripts/test-saved-filters-removed.mjs
