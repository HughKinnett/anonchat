name: Discovery and Feed focused CI

on:
  push:
    branches:
      - growth-web-release
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/test-feed-mode-policy.mjs
      - run: node scripts/test-feed-ranking-policy.mjs
