name: Restore service worker v148

on:
  push:
    paths:
      - '.github/workflows/restore-sw-v148.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore complete service worker and bump cache
        run: |
          git show 4dd1d8edc5534e19d74bce6094c623b20ad422b6:sw.js > sw.js
          python3 - <<'PY'
          from pathlib import Path
          p = Path('sw.js')
          s = p.read_text()
          old = 'const CACHE_NAME = "anonchat-v147";'
          new = 'const CACHE_NAME = "anonchat-v148";'
          if old not in s:
              raise SystemExit('Expected v147 cache marker not found')
          p.write_text(s.replace(old, new, 1))
          PY
          test "$(wc -l < sw.js)" -gt 200
          grep -q 'self.addEventListener("fetch"' sw.js
          grep -q 'self.addEventListener("push"' sw.js
      - name: Commit restored service worker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sw.js
          git commit -m "Restore service worker and bump cache to v148"
          git push
