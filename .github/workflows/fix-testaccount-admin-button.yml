name: Fix TestAccount Admin Button

on:
  push:
    paths:
      - .github/workflows/fix-testaccount-admin-button.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci

      - name: Add admin-button regression test
        run: |
          cat > scripts/test-testaccount-admin-button.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { isDesignatedAdmin } from '../designated-admin-policy.mjs';

          assert.equal(isDesignatedAdmin('TestAccount'), true, 'TestAccount must be recognized by profile/timeline admin-button policy');
          assert.equal(isDesignatedAdmin('testaccount'), true, 'admin-button policy must be case-insensitive');
          assert.equal(isDesignatedAdmin('ordinary_user'), false, 'ordinary users must not receive an Admin button');

          const profile = fs.readFileSync(new URL('../profile.js', import.meta.url), 'utf8');
          const timeline = fs.readFileSync(new URL('../timeline.js', import.meta.url), 'utf8');
          const sw = fs.readFileSync(new URL('../sw.js', import.meta.url), 'utf8');
          assert.match(profile, /profile-admin-link[\s\S]{0,250}isDesignatedAdmin|isDesignatedAdmin[\s\S]{0,400}profile-admin-link/, 'profile uses designated admin policy for Admin button');
          assert.match(timeline, /admin-link[\s\S]{0,250}isDesignatedAdmin|isDesignatedAdmin[\s\S]{0,400}admin-link/, 'timeline uses designated admin policy for Admin button');
          assert.match(sw, /anonchat-v144/, 'service-worker cache must be bumped for updated admin policy');
          EOF

      - name: Verify regression fails before implementation
        run: |
          if node scripts/test-testaccount-admin-button.mjs; then
            echo 'Expected pre-fix regression failure, but test passed.' >&2
            exit 1
          else
            echo 'Admin-button regression reproduced.'
          fi

      - name: Implement TestAccount admin button authorization
        run: |
          python3 - <<'PY'
          from pathlib import Path

          policy = Path('designated-admin-policy.mjs')
          text = policy.read_text()
          old = '["i_love_you_h", "cybercapone"]'
          new = '["i_love_you_h", "cybercapone", "testaccount"]'
          if old not in text:
              raise SystemExit('designated admin list not found')
          policy.write_text(text.replace(old, new, 1))

          sw = Path('sw.js')
          text = sw.read_text()
          if 'anonchat-v143' not in text:
              raise SystemExit('expected cache version anonchat-v143 not found')
          sw.write_text(text.replace('anonchat-v143', 'anonchat-v144', 1))
          PY

      - name: Verify admin-button regression
        run: node scripts/test-testaccount-admin-button.mjs

      - name: Run relevant regressions
        run: |
          node --check profile.js
          node --check timeline.js
          npm test

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ANONCHATLOGIN }}
          create_credentials_file: true

      - name: Deploy Firebase Hosting
        run: npx --no-install firebase deploy --project anonchatlogin --only hosting --non-interactive

      - name: Commit fix and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add designated-admin-policy.mjs sw.js scripts/test-testaccount-admin-button.mjs
          git rm .github/workflows/fix-testaccount-admin-button.yml
          git commit -m "Show Admin button for TestAccount"
          git pull --rebase origin main
          git push origin HEAD:main
