name: Repair admin deletion premium message fixture

on:
  push:
    branches: [fix/e2ee-spotify-privacy]
    paths:
      - scripts/repair-admin-deletion-premium-message-fixture.mjs
      - .github/workflows/repair-admin-deletion-premium-message-fixture.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/e2ee-spotify-privacy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/repair-admin-deletion-premium-message-fixture.mjs
      - run: git diff --check
      - name: Commit repair
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/test-admin-deletion-firestore-integration.mjs
          git commit -m "test: cover premium room message cleanup fixture"
          git push origin HEAD:fix/e2ee-spotify-privacy
