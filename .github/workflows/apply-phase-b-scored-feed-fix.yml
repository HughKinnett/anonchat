name: Apply Phase B scored feed fix

on:
  push:
    branches:
      - phase-b-content-discovery
    paths:
      - scripts/apply-phase-b-scored-feed-fix.mjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/apply-phase-b-scored-feed-fix.mjs
      - run: node scripts/test-feed-mode-policy.mjs
      - run: node scripts/test-timeline-moderation-ui.mjs
      - run: node --check timeline.js
      - name: Commit generated fix
        run: |
          if git diff --quiet -- timeline.js; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add timeline.js
          git commit -m "fix: route discovery ordering through feed policy"
          git push
