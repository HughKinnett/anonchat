name: Purge retired Groups and Communities

on:
  workflow_run:
    workflows: ["Deploy Firebase"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: anonchat-retired-groups-communities-purge
  cancel-in-progress: false

jobs:
  purge:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out deployed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install trusted dependencies
        run: npm ci

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ANONCHATLOGIN }}

      - name: Purge retired Groups and Interest Communities data
        run: node scripts/purge-retired-groups-communities.mjs
        env:
          GCLOUD_PROJECT: anonchatlogin
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
