name: Apply Phase B profile parity

on:
  push:
    branches:
      - phase-b-content-discovery
    paths:
      - scripts/apply-phase-b-profile-parity.mjs
      - .github/workflows/apply-phase-b-profile-parity.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-b-content-discovery
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/apply-phase-b-profile-parity.mjs
      - name: Verify syntax and focused contract
        run: |
          node --check profile.js
          node scripts/test-phase-b-ui.mjs
      - name: Commit generated profile integration
        run: |
          if git diff --quiet; then
            echo "No profile changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile.js
          git commit -m "feat: add Phase B profile and pinned-post parity"
          git push origin HEAD:phase-b-content-discovery
