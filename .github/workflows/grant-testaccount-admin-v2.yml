name: Grant TestAccount Admin Dashboard v2

on:
  push:
    paths:
      - .github/workflows/grant-testaccount-admin-v2.yml

permissions:
  contents: write

jobs:
  grant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci

      - name: Add admin-access regression test
        run: |
          cat > scripts/test-testaccount-admin-access.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { isAuthorizedAdministratorUsername, isProtectedAdministrator } from '../admin-deletion-policy.mjs';
          assert.equal(isAuthorizedAdministratorUsername('TestAccount'), true);
          assert.equal(isAuthorizedAdministratorUsername('testaccount'), true);
          assert.equal(isProtectedAdministrator('TestAccount'), false);
          assert.equal(isProtectedAdministrator('i_love_you_h'), true);
          assert.equal(isProtectedAdministrator('cybercapone'), true);
          const adminJs = fs.readFileSync(new URL('../admin.js', import.meta.url), 'utf8');
          assert.match(adminJs, /isAuthorizedAdministratorUsername\(username\)/);
          const rules = fs.readFileSync(new URL('../firestore.rules', import.meta.url), 'utf8');
          assert.match(rules, /normalizedUsername in \['i_love_you_h', 'cybercapone', 'testaccount'\]/);
          assert.match(rules, /i_love_you_h\|cybercapone/);
          EOF

      - name: Verify regression fails before implementation
        run: |
          if node scripts/test-testaccount-admin-access.mjs; then exit 1; else echo 'Regression reproduced.'; fi

      - name: Implement TestAccount admin authorization
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('admin-deletion-policy.mjs'); t=p.read_text()
          old='''export const PROTECTED_ADMIN_USERNAMES = Object.freeze([\n  "i_love_you_h",\n  "cybercapone"\n]);\n'''
          new=old+'''\nexport const ADMIN_USERNAMES = Object.freeze([\n  ...PROTECTED_ADMIN_USERNAMES,\n  "testaccount"\n]);\n'''
          if old not in t: raise SystemExit('protected admin list not found')
          t=t.replace(old,new,1)
          marker='''export const isProtectedAdministrator = (username) =>\n  PROTECTED_ADMIN_USERNAMES.includes(normalizeUsername(username));\n'''
          replacement=marker+'''\nexport const isAuthorizedAdministratorUsername = (username) =>\n  ADMIN_USERNAMES.includes(normalizeUsername(username));\n'''
          if marker not in t: raise SystemExit('protected admin helper not found')
          p.write_text(t.replace(marker,replacement,1))

          p=Path('admin.js'); t=p.read_text()
          t=t.replace('canAdminSetBanned, canQueueAdminDeletion, isProtectedAdministrator, normalizeUsername','canAdminSetBanned, canQueueAdminDeletion, isAuthorizedAdministratorUsername, isProtectedAdministrator, normalizeUsername',1)
          old='const reservation = isProtectedAdministrator(username) ? await getDoc(doc(db, "usernames", normalizeUsername(username))) : null;'
          new='const reservation = isAuthorizedAdministratorUsername(username) ? await getDoc(doc(db, "usernames", normalizeUsername(username))) : null;'
          if old not in t: raise SystemExit('admin authorization line not found')
          p.write_text(t.replace(old,new,1))

          p=Path('firestore.rules'); t=p.read_text()
          old="normalizedUsername in ['i_love_you_h', 'cybercapone']"
          new="normalizedUsername in ['i_love_you_h', 'cybercapone', 'testaccount']"
          if old not in t: raise SystemExit('rules admin whitelist not found')
          p.write_text(t.replace(old,new,1))
          PY

      - name: Verify relevant tests
        run: |
          node scripts/test-testaccount-admin-access.mjs
          node scripts/test-admin-dashboard-policy.mjs
          node scripts/test-admin-command-center.mjs
          node scripts/test-admin-expanded-controls.mjs
          npm test

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ANONCHATLOGIN }}
          create_credentials_file: true

      - name: Verify TestAccount reservation in production
        env:
          GCLOUD_PROJECT: anonchatlogin
        run: |
          node --input-type=module <<'EOF'
          import { applicationDefault, initializeApp } from 'firebase-admin/app';
          import { getFirestore } from 'firebase-admin/firestore';
          initializeApp({ credential: applicationDefault(), projectId: process.env.GCLOUD_PROJECT });
          const db=getFirestore();
          const reservation=await db.collection('usernames').doc('testaccount').get();
          if(!reservation.exists) throw new Error('usernames/testaccount missing');
          const {uid,username}=reservation.data();
          if(!uid || String(username).toLowerCase()!=='testaccount') throw new Error('invalid TestAccount reservation');
          const profile=await db.collection('users').doc(uid).get();
          if(!profile.exists || String(profile.data()?.username).toLowerCase()!=='testaccount') throw new Error('TestAccount profile mismatch');
          console.log(`Verified TestAccount admin reservation uid=${uid}`);
          EOF

      - name: Deploy admin authorization
        run: |
          npx --no-install firebase deploy --project anonchatlogin --only firestore:rules --non-interactive
          npx --no-install firebase deploy --project anonchatlogin --only hosting --non-interactive

      - name: Commit implementation and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-deletion-policy.mjs admin.js firestore.rules scripts/test-testaccount-admin-access.mjs
          git rm -f .github/workflows/grant-testaccount-admin.yml .github/workflows/grant-testaccount-admin-v2.yml
          git commit -m "Authorize TestAccount for Admin Dashboard"
          git pull --rebase origin main
          git push origin HEAD:main
