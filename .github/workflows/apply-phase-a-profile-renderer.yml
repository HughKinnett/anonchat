name: Apply Phase A profile renderer patch

on:
  push:
    branches:
      - phase-a-profiles-identity
    paths:
      - scripts/apply-phase-a-profile-renderer.mjs
      - .github/workflows/apply-phase-a-profile-renderer.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-a-profiles-identity
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/apply-phase-a-profile-renderer.mjs
      - name: Commit materialized renderer changes
        run: |
          if git diff --quiet -- profile.js; then
            echo "No renderer changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile.js
          git commit -m "feat: add pinned profile rendering"
          git push origin HEAD:phase-a-profiles-identity
