name: Apply Discovery Feed Task 2

on:
  push:
    branches:
      - growth-web-release
    paths:
      - scripts/patch-discovery-feed-task2.mjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: growth-web-release
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/patch-discovery-feed-task2.mjs
      - run: |
          if git diff --quiet -- timeline.html timeline.js; then
            echo "No Task 2 patch changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add timeline.html timeline.js
          git commit -m "feat: add timeline feed controls"
          git push origin HEAD:growth-web-release
