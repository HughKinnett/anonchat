name: Apply admin billing preparation UI

on:
  push:
    branches:
      - feature/payment-ui-android-parity

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/payment-ui-android-parity
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-payment-admin-ui.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add admin.html
            git commit -m "feat: add admin payment preparation panel"
            git push
          fi
