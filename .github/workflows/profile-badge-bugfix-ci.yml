name: Profile badges and bugfix CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: node scripts/test-private-message-send-readiness.mjs
      - run: node scripts/test-direct-message-conversation-migration.mjs
      - run: node scripts/test-founder-founding-premium-entitlement.mjs
      - name: Diagnose QR vendor dependency bundle
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://cdn.jsdelivr.net/npm/qrcode@1.5.4/+esm \
            --output /tmp/qrcode.mjs
          curl --fail --silent --show-error --location --retry 3 \
            https://cdn.jsdelivr.net/npm/dijkstrajs@1.0.3/+esm \
            --output /tmp/dijkstrajs.mjs
          sha256sum /tmp/qrcode.mjs /tmp/dijkstrajs.mjs
          echo '--- qrcode imports ---'
          grep -Eo 'from[[:space:]]+"[^"]+"|from[[:space:]]+'"'"'[^'"'"']+'"'"'' /tmp/qrcode.mjs || true
          echo '--- dijkstra imports ---'
          grep -Eo 'from[[:space:]]+"[^"]+"|from[[:space:]]+'"'"'[^'"'"']+'"'"'' /tmp/dijkstrajs.mjs || true
      - run: node scripts/test-profile-qr-rendering.mjs
      - run: node scripts/test-login-storage-fallback.mjs
      - run: node scripts/test-admin-badges-surface.mjs
      - run: node scripts/test-profile-badge-collection.mjs
      - run: node scripts/test-profile-privacy-policy.mjs
      - run: node scripts/test-badge-full-reconciliation.mjs
      - run: node scripts/test-badge-reconciliation-state.mjs
      - run: node scripts/test-existing-user-badge-backfill-workflow.mjs
