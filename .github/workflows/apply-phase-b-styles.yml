name: Apply Phase B responsive styles

on:
  push:
    branches:
      - phase-b-content-discovery
    paths:
      - scripts/apply-phase-b-styles.mjs
      - .github/workflows/apply-phase-b-styles.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-b-content-discovery
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/apply-phase-b-styles.mjs
      - run: node scripts/test-phase-b-styles.mjs
      - name: Commit responsive styles
        run: |
          if git diff --quiet; then
            echo "No style changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add timeline.css
          git commit -m "style: add responsive Phase B media and reply layouts"
          git push origin HEAD:phase-b-content-discovery
