name: Repair verified auth test contexts

on:
  push:
    branches:
      - fix/e2ee-spotify-privacy
    paths:
      - scripts/repair-verified-auth-test-contexts.mjs
      - .github/workflows/repair-verified-auth-test-contexts.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/e2ee-spotify-privacy
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Migrate legacy authenticated test contexts
        run: node scripts/repair-verified-auth-test-contexts.mjs
      - name: Validate patch
        run: |
          git diff --check
          git diff --stat
      - name: Commit repaired fixtures
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/test-*.mjs
          git commit -m "test: align authenticated fixtures with verified-email rule"
          git push origin HEAD:fix/e2ee-spotify-privacy
