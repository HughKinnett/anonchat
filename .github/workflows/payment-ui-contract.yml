name: Payment UI contract

on:
  push:
    branches:
      - feature/payment-ui-android-parity

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/test-payment-preparation-ui.mjs
