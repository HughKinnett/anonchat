name: Deploy Firebase

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Stage Firebase production rollout
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install trusted dependencies
        run: npm ci

      - name: Stage locally hosted QR renderer
        run: |
          mkdir -p vendor
          curl --fail --silent --show-error --location --retry 3 \
            https://cdn.jsdelivr.net/npm/qrcode@1.5.4/+esm \
            --output vendor/qrcode.mjs
          curl --fail --silent --show-error --location --retry 3 \
            https://cdn.jsdelivr.net/npm/dijkstrajs@1.0.3/+esm \
            --output vendor/dijkstrajs.mjs
          cat > /tmp/qr-checksums <<'EOF'
          f712a06862e06fdbb45fc846f9ad273624835025d8c4657c139a0d678d2d3733  vendor/qrcode.mjs
          62dc939c7c6d5b83a148931d0852d636a15f9d414023c1032647adcac06a4123  vendor/dijkstrajs.mjs
          EOF
          sha256sum -c /tmp/qr-checksums
          sed -i 's#"/npm/dijkstrajs@1.0.3/+esm"#"./dijkstrajs.mjs"#g' vendor/qrcode.mjs
          ! grep -F '"/npm/' vendor/qrcode.mjs
          ! grep -F '"/npm/' vendor/dijkstrajs.mjs

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ANONCHATLOGIN }}
          create_credentials_file: true

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Verify Firebase cost index policy
        run: npm run test:cost-indexes

      - name: Verify Premium access policy
        run: npm run test:premium

      - name: Ensure required Firestore indexes
        run: npm run rollout:ensure-indexes
        env:
          GCLOUD_PROJECT: anonchatlogin

      - name: Ensure Firestore field index exemptions
        run: npm run rollout:ensure-field-exemptions
        env:
          GCLOUD_PROJECT: anonchatlogin

      - name: Grant launch accounts Founding access
        run: npm run rollout:premium-founders
        env:
          GCLOUD_PROJECT: anonchatlogin

      - name: Wait for required Firestore indexes
        run: npm run rollout:wait-indexes
        timeout-minutes: 22
        env:
          GCLOUD_PROJECT: anonchatlogin
          FIRESTORE_INDEX_TIMEOUT_SECONDS: "1200"

      - name: Run moderation processor and backfills
        run: npm run rollout:process-moderation
        env:
          GCLOUD_PROJECT: anonchatlogin

      - name: Verify production rollout gates
        run: npm run rollout:verify
        env:
          GCLOUD_PROJECT: anonchatlogin

      - name: Migrate accepted private messages
        run: npm run rollout:migrate-direct-messages
        env:
          GCLOUD_PROJECT: anonchatlogin

      - name: Deploy Firestore rules
        run: npx --no-install firebase deploy --project anonchatlogin --only firestore:rules --non-interactive

      - name: Drain poll votes created during rules cutover
        run: npm run rollout:migrate-poll-votes
        env:
          GCLOUD_PROJECT: anonchatlogin

      - name: Deploy Firebase Hosting
        run: npx --no-install firebase deploy --project anonchatlogin --only hosting --non-interactive

      - name: Catch private messages created during cutover
        run: npm run rollout:migrate-direct-messages
        env:
          GCLOUD_PROJECT: anonchatlogin