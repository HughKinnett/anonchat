name: Apply interaction fix

on:
  push:
    branches:
      - fix/reliable-interactions-and-spotify-mask

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reliable-interactions-and-spotify-mask
      - name: Apply focused production fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('timeline.js')
          text = path.read_text()

          text, count = re.subn(
              r'  if \(interactionsReady\) \{[\s\S]*?  \}\n  interactionSummaryLabel\.title',
              '  interactionSummaryLabel.textContent = `💬 ${activeReactionIcons ? `${activeReactionIcons} · ` : ""}${interactionTotal} interaction${interactionCount === 1 ? "" : "s"}`;\n  interactionSummaryLabel.setAttribute("aria-label", `${interactionTotal} interaction${interactionCount === 1 ? "" : "s"}. Show who interacted.`);\n  interactionSummaryLabel.title',
              text,
              count=1
          )
          if count != 1:
              raise SystemExit(f'interaction summary replacement count={count}')

          text, count = re.subn(
              r'  let commentsSection;\n  if \(commentsReady\) \{\n    commentsSection = document\.createElement\("details"\);',
              '  let commentsSection;\n  commentsSection = document.createElement("details");',
              text,
              count=1
          )
          if count != 1:
              raise SystemExit(f'comments opening replacement count={count}')

          text, count = re.subn(
              r'\n  \} else \{\n  commentsSection = document\.createElement\("details"\);[\s\S]*?\n\}\n\n  const actions = document\.createElement\("div"\);',
              '\n\n  const actions = document.createElement("div");',
              text,
              count=1
          )
          if count != 1:
              raise SystemExit(f'comments fallback replacement count={count}')

          text, count = re.subn(
              r'    if \(existing\) \{\n      const shouldListen = !document\.hidden[\s\S]*?      return;\n    \}',
              '    if (existing) {\n      if (visibleParent && !existing.childrenStarted) {\n        existing.sourceUnsubscribe?.();\n        existing.sourceUnsubscribe = undefined;\n        existing.parentDoc = visibleParent;\n        startInteractionChildren(existing);\n      }\n      return;\n    }',
              text,
              count=1
          )
          if count != 1:
              raise SystemExit(f'existing listener replacement count={count}')

          text, count = re.subn(
              r'    if \(visibleParent\) \{\n      if \(!document\.hidden[\s\S]*?startInteractionChildren\(entry\);\n      return;\n    \}',
              '    if (visibleParent) {\n      startInteractionChildren(entry);\n      return;\n    }',
              text,
              count=1
          )
          if count != 1:
              raise SystemExit(f'new listener replacement count={count}')

          path.write_text(text)

          css_path = Path('sharing-privacy.css')
          css = css_path.read_text()
          if 'top:64px' not in css or 'top:62px' not in css:
              raise SystemExit('Spotify mask positions not found')
          css = css.replace('top:64px', 'top:72px', 1).replace('top:62px', 'top:70px', 1)
          css_path.write_text(css)
          PY
      - name: Commit focused production fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add timeline.js sharing-privacy.css
          git diff --cached --quiet && exit 0
          git commit -m "fix: make interactions reliable across feeds"
          git push origin HEAD:fix/reliable-interactions-and-spotify-mask
