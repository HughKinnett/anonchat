name: Phase C messaging patch

on:
  push:
    branches: [phase-c-inline-implementation]
    paths: [.phase-c-messaging-trigger]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-c-inline-implementation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-phase-c-messaging-patches.mjs
      - name: Commit Phase C messaging patches
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add community.html firestore.rules
          git commit -m "feat: wire private message reactions"
          git push origin HEAD:phase-c-inline-implementation
