name: Repair comments surface

on:
  push:
    branches:
      - fix/post-deploy-regressions
    paths:
      - .github/workflows/repair-comments-surface.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/post-deploy-regressions
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch interaction totals and details
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'expected {label} block not found')
              return text.replace(old, new, 1)

          timeline_path = Path('timeline.js')
          timeline = timeline_path.read_text()
          timeline = replace_once(
              timeline,
              '  const interactionEntry = interactionSubscriptions.get(parent.path);\n  const reactionDocs = postReactions(postDoc);\n',
              '  const interactionEntry = interactionSubscriptions.get(parent.path);\n  const reactionDocs = postReactions(postDoc);\n  const commentDocs = postComments(postDoc);\n',
              'timeline interaction documents'
          )
          timeline = replace_once(
              timeline,
              '  const count = reactionDocs.length;\n  const reactionTotal = boundedInteractionCount(count, reactionsTruncated);\n',
              '  const interactionCount = reactionDocs.length + commentDocs.length;\n  const interactionTruncated = reactionsTruncated || interactionIsTruncated(parent.path, "comments");\n  const interactionTotal = boundedInteractionCount(interactionCount, interactionTruncated);\n',
              'timeline interaction count'
          )
          timeline = replace_once(
              timeline,
              '    interactionSummaryLabel.textContent = `${activeReactionIcons ? `${activeReactionIcons} · ` : ""}${reactionTotal}`;\n    interactionSummaryLabel.setAttribute("aria-label",\n      `${reactionTotal} interaction${count === 1 ? "" : "s"}. Show who interacted.`);\n',
              '    interactionSummaryLabel.textContent = `${activeReactionIcons ? `${activeReactionIcons} · ` : ""}${interactionTotal} interaction${interactionCount === 1 ? "" : "s"}`;\n    interactionSummaryLabel.setAttribute("aria-label",\n      `${interactionTotal} interaction${interactionCount === 1 ? "" : "s"}. Show who interacted.`);\n',
              'timeline interaction summary'
          )
          timeline = replace_once(
              timeline,
              '  if (!reactionDocs.length) {\n',
              '  if (!interactionCount) {\n',
              'timeline empty interaction state'
          )
          timeline = replace_once(
              timeline,
              '    reactionDocs.forEach((reaction) => {\n      const row = document.createElement("li");\n      const profile = users.find((user) => user.id === reaction.data().uid)?.data();\n      const link = document.createElement("a");\n      link.href = `profile.html?uid=${encodeURIComponent(reaction.data().uid)}`;\n      link.textContent = `@${profile?.username || "anonymous"}`;\n      row.append(link, document.createTextNode(` reacted ${reactionEmoji[reaction.data().type] || "•"}`));\n      interactionPeople.append(row);\n    });\n',
              '    reactionDocs.forEach((reaction) => {\n      const row = document.createElement("li");\n      const profile = users.find((user) => user.id === reaction.data().uid)?.data();\n      const link = document.createElement("a");\n      link.href = `profile.html?uid=${encodeURIComponent(reaction.data().uid)}`;\n      link.textContent = `@${profile?.username || "anonymous"}`;\n      row.append(link, document.createTextNode(` reacted ${reactionEmoji[reaction.data().type] || "•"}`));\n      interactionPeople.append(row);\n    });\n    commentDocs.forEach((commentDoc) => {\n      const comment = commentDoc.data();\n      const row = document.createElement("li");\n      const link = document.createElement("a");\n      link.href = `profile.html?uid=${encodeURIComponent(comment.uid)}`;\n      link.textContent = `@${comment.username || "anonymous"}`;\n      row.append(link, document.createTextNode(" commented"));\n      interactionPeople.append(row);\n    });\n',
              'timeline interaction people'
          )
          timeline = replace_once(
              timeline,
              '  if (commentsReady) {\n    const commentDocs = postComments(postDoc);\n',
              '  if (commentsReady) {\n',
              'timeline duplicate comment documents'
          )
          timeline_path.write_text(timeline)

          profile_path = Path('profile.js')
          profile = profile_path.read_text()
          profile = replace_once(
              profile,
              '    const reactionDocs = postReactions(postDoc);\n',
              '    const reactionDocs = postReactions(postDoc);\n    const commentDocs = postComments(postDoc);\n',
              'profile interaction documents'
          )
          profile = replace_once(
              profile,
              '    reactionSummary.textContent = `${icons ? `${icons} · ` : ""}${reactionDocs.length} interaction${reactionDocs.length === 1 ? "" : "s"}`;\n',
              '    const interactionCount = reactionDocs.length + commentDocs.length;\n    reactionSummary.textContent = `${icons ? `${icons} · ` : ""}${interactionCount} interaction${interactionCount === 1 ? "" : "s"}`;\n',
              'profile interaction count'
          )
          profile = replace_once(
              profile,
              '    if (!reactionDocs.length) {\n',
              '    if (!interactionCount) {\n',
              'profile empty interaction state'
          )
          profile = replace_once(
              profile,
              '    } else reactionDocs.forEach((reaction) => {\n      const row = document.createElement("li");\n      const actor = users.find((entry) => entry.id === reaction.data().uid)?.data();\n      const link = document.createElement("a");\n      link.href = `profile.html?uid=${encodeURIComponent(reaction.data().uid)}`;\n      link.textContent = `@${actor?.username || "anonymous"}`;\n      row.append(link, document.createTextNode(` reacted ${reactionEmoji[reaction.data().type] || "•"}`));\n      reactionList.append(row);\n    });\n',
              '    } else reactionDocs.forEach((reaction) => {\n      const row = document.createElement("li");\n      const actor = users.find((entry) => entry.id === reaction.data().uid)?.data();\n      const link = document.createElement("a");\n      link.href = `profile.html?uid=${encodeURIComponent(reaction.data().uid)}`;\n      link.textContent = `@${actor?.username || "anonymous"}`;\n      row.append(link, document.createTextNode(` reacted ${reactionEmoji[reaction.data().type] || "•"}`));\n      reactionList.append(row);\n    });\n    commentDocs.forEach((commentDoc) => {\n      const comment = commentDoc.data();\n      const row = document.createElement("li");\n      const link = document.createElement("a");\n      link.href = `profile.html?uid=${encodeURIComponent(comment.uid)}`;\n      link.textContent = `@${comment.username || "anonymous"}`;\n      row.append(link, document.createTextNode(" commented"));\n      reactionList.append(row);\n    });\n',
              'profile interaction people'
          )
          profile = replace_once(
              profile,
              '    const commentDocs = postComments(postDoc);\n    const commentsSection = document.createElement("details");\n',
              '    const commentsSection = document.createElement("details");\n',
              'profile duplicate comment documents'
          )
          profile_path.write_text(profile)
          PY
      - name: Run targeted regressions
        run: |
          node scripts/test-interaction-details.mjs
          node scripts/test-follow-privacy-surface.mjs
          node scripts/test-comment-surface-regression.mjs
      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet -- timeline.js profile.js; then
            echo "No repair needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add timeline.js profile.js
          git commit -m "feat: count comments in post interactions"
          git push origin HEAD:fix/post-deploy-regressions
