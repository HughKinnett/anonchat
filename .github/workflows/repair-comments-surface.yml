name: Repair comments surface

on:
  push:
    branches:
      - fix/post-deploy-regressions
    paths:
      - .github/workflows/repair-comments-surface.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/post-deploy-regressions
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch profile connection privacy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('profile.js')
          text = path.read_text()
          pattern = re.compile(
              r'  const followersLink = document\.getElementById\("profile-followers"\);\n'
              r'  const followingLink = document\.getElementById\("profile-following"\);\n'
              r'  followersLink\.textContent = `\$\{count\} \$\{count === 1 \? "follower" : "followers"\}`;\n'
              r'  followingLink\.textContent = `\$\{following\} following`;\n'
              r'  followersLink\.href = `connections\.html\?uid=\$\{encodeURIComponent\(targetUserId\)\}#followers`;\n'
              r'  followingLink\.href = `connections\.html\?uid=\$\{encodeURIComponent\(targetUserId\)\}#following`;\n'
          )
          replacement = '''  const followersLink = document.getElementById("profile-followers");
          const followingLink = document.getElementById("profile-following");
          const ownConnectionsVisible = targetUserId === currentUser.uid;
          followersLink.textContent = ownConnectionsVisible
            ? `${count} ${count === 1 ? "follower" : "followers"}`
            : "Followers private";
          followingLink.textContent = ownConnectionsVisible
            ? `${following} following`
            : "Following private";
          if (ownConnectionsVisible) {
            followersLink.href = `connections.html?uid=${encodeURIComponent(targetUserId)}#followers`;
            followingLink.href = `connections.html?uid=${encodeURIComponent(targetUserId)}#following`;
          } else {
            followersLink.removeAttribute("href");
            followingLink.removeAttribute("href");
          }
          '''
          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'expected one profile follower/following block, found {count}')
          path.write_text(updated)
          PY
      - name: Run targeted regressions
        run: |
          node scripts/test-follow-privacy-surface.mjs
          node scripts/test-comment-surface-regression.mjs
      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet -- profile.js; then
            echo "No repair needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile.js
          git commit -m "fix: keep connection details private"
          git push origin HEAD:fix/post-deploy-regressions
