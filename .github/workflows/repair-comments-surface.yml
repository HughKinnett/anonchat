name: Repair comments surface

on:
  push:
    branches:
      - fix/post-deploy-regressions
    paths:
      - .github/workflows/repair-comments-surface.yml

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/post-deploy-regressions
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify Spotify playlist privacy
        run: node scripts/test-spotify-playlist-privacy.mjs
