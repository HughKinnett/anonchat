name: Repair interaction readiness gate

on:
  push:
    branches:
      - fix/post-deploy-regressions
    paths:
      - .github/workflows/repair-comments-surface.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/post-deploy-regressions
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require complete interaction state before publishing totals
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('timeline.js')
          text = path.read_text()
          old = '''  const reactionsReady = Boolean(interactionEntry?.ready?.reactions && interactionEntry?.ready?.viewerReaction);
          const commentsReady = Boolean(interactionEntry?.ready?.comments);
          const reactionsTruncated = interactionIsTruncated(parent.path, "reactions");'''
          new = '''  const reactionsReady = Boolean(interactionEntry?.ready?.reactions && interactionEntry?.ready?.viewerReaction);
          const commentsReady = Boolean(interactionEntry?.ready?.comments);
          const interactionsReady = reactionsReady && commentsReady;
          const reactionsTruncated = interactionIsTruncated(parent.path, "reactions");'''
          if old not in text:
              raise SystemExit('interaction readiness block not found')
          text = text.replace(old, new, 1)
          old = '''  if (reactionsReady) {
            interactionSummaryLabel.textContent = `${activeReactionIcons ? `${activeReactionIcons} · ` : ""}${interactionTotal} interaction${interactionCount === 1 ? "" : "s"}`;'''
          new = '''  if (interactionsReady) {
            interactionSummaryLabel.textContent = `${activeReactionIcons ? `${activeReactionIcons} · ` : ""}${interactionTotal} interaction${interactionCount === 1 ? "" : "s"}`;'''
          if old not in text:
              raise SystemExit('interaction summary gate not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Run interaction regression
        run: node scripts/test-interaction-details.mjs
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add timeline.js
          git commit -m "fix: wait for complete interaction totals"
          git push origin HEAD:fix/post-deploy-regressions
