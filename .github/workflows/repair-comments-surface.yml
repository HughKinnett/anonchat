name: Repair interaction readiness gate

on:
  push:
    branches:
      - fix/post-deploy-regressions
    paths:
      - .github/workflows/repair-comments-surface.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/post-deploy-regressions
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require complete interaction state before publishing totals
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('timeline.js')
          text = path.read_text()
          text, first = re.subn(
              r'(\s*const commentsReady = Boolean\(interactionEntry\?\.ready\?\.comments\);\n)',
              r'\1  const interactionsReady = reactionsReady && commentsReady;\n',
              text,
              count=1
          )
          text, second = re.subn(r'\bif \(reactionsReady\) \{', 'if (interactionsReady) {', text, count=1)
          if first != 1 or second != 1:
              raise SystemExit(f'expected one readiness insertion and one summary gate; got {first}, {second}')
          path.write_text(text)
          PY
      - name: Run interaction regression
        run: node scripts/test-interaction-details.mjs
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add timeline.js
          git commit -m "fix: wait for complete interaction totals"
          git push origin HEAD:fix/post-deploy-regressions
