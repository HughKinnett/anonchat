name: Phase C CI

on:
  push:
    branches: [phase-c-inline-implementation]
  pull_request:
    branches: [main]

jobs:
  messaging-policy-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node scripts/test-private-message-reaction-policy.mjs
      - run: node scripts/test-private-message-reply-policy.mjs
      - run: node scripts/test-private-message-visibility-policy.mjs
      - run: node scripts/test-private-message-request-policy.mjs
      - run: node scripts/test-private-message-typing-policy.mjs
      - run: node scripts/test-private-message-typing-integration.mjs
      - run: node scripts/test-private-message-reactions-integration.mjs
      - run: node scripts/test-private-message-replies-integration.mjs
      - run: node scripts/test-private-message-delete-unsend-integration.mjs
      - run: node scripts/test-private-message-request-privacy-integration.mjs
      - run: for file in community.js sw.js private-message-*.js private-message-*.mjs scripts/test-private-message-*.mjs scripts/test-community-lifecycle.mjs; do node --check "$file"; done
      - run: node scripts/test-push-service-worker.mjs
      - run: npm run test:firestore-ci
