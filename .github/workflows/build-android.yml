name: Build Android

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - 'e2ee-device-key-store.mjs'
      - 'e2ee-identity.js'
      - 'appearance-accessibility.css'
      - 'appearance-accessibility.js'
      - 'controls.css'
      - 'profile.html'
      - 'profile.js'
      - 'profile-badges.js'
      - 'profile-phase-a.js'
      - 'profile-phase-a.css'
      - 'profile-privacy-policy.mjs'
      - 'profile-pinning.mjs'
      - 'profile-share.mjs'
      - 'sw.js'
      - '.github/workflows/build-android.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'e2ee-device-key-store.mjs'
      - 'e2ee-identity.js'
      - 'appearance-accessibility.css'
      - 'appearance-accessibility.js'
      - 'controls.css'
      - 'profile.html'
      - 'profile.js'
      - 'profile-badges.js'
      - 'profile-phase-a.js'
      - 'profile-phase-a.css'
      - 'profile-privacy-policy.mjs'
      - 'profile-pinning.mjs'
      - 'profile-share.mjs'
      - 'sw.js'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable APK and Play bundle
        working-directory: android
        run: gradle assembleDebug assembleRelease bundleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: anonchat-android-build
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release-unsigned.apk
            android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
