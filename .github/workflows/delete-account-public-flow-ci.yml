name: Delete Account Public Flow CI

on:
  push:
    paths:
      - scripts/test-public-delete-account-flow.mjs
      - delete-account.js
      - .github/workflows/delete-account-public-flow-ci.yml

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/test-public-delete-account-flow.mjs
