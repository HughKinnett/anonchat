name: Apply Phase A admin features patch

on:
  push:
    branches:
      - phase-a-profiles-identity
    paths:
      - scripts/apply-phase-a-admin-features.mjs
      - .github/workflows/apply-phase-a-admin-features.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-a-profiles-identity
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/apply-phase-a-admin-features.mjs
      - name: Commit materialized admin changes
        run: |
          if git diff --quiet -- admin.js; then
            echo "No admin changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.js
          git commit -m "feat: add Phase A admin emergency controls"
          git push origin HEAD:phase-a-profiles-identity
