name: Apply Phase B package integration

on:
  push:
    branches:
      - phase-b-content-discovery
    paths:
      - scripts/apply-phase-b-package.mjs
      - .github/workflows/apply-phase-b-package.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-b-content-discovery
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/apply-phase-b-package.mjs
      - run: node scripts/test-phase-b-package.mjs
      - name: Commit package integration
        run: |
          if git diff --quiet; then
            echo "No package changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "ci: add Phase B regression commands"
          git push origin HEAD:phase-b-content-discovery
