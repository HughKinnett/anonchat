name: Cleanup moderation direct-room repair

on:
  push:
    branches:
      - fix/e2ee-spotify-privacy
    paths:
      - .github/workflows/repair-moderation-direct-room-e2ee-fixtures.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/e2ee-spotify-privacy
          fetch-depth: 0
      - name: Remove temporary repair scaffolding
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repair-moderation-direct-room-e2ee-fixtures.yml scripts/repair-moderation-direct-room-e2ee-fixtures.mjs
          git commit -m "chore: remove moderation E2EE repair scaffolding"
          git push origin HEAD:fix/e2ee-spotify-privacy
