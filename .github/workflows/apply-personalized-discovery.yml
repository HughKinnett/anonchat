name: Apply personalized discovery implementation

on:
  push:
    branches:
      - feature/personalized-discovery-ranking
    paths:
      - '.github/workflows/apply-personalized-discovery.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/personalized-discovery-ranking
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply timeline and UI patch
        run: node scripts/apply-personalized-discovery-ranking.mjs
      - name: Verify focused tests before commit
        run: |
          node scripts/test-suggested-follow-policy.mjs
          node scripts/test-feed-ranking-policy.mjs
          node scripts/test-hashtag-discovery-policy.mjs
          node scripts/test-timeline-recommendation-context.mjs
          node scripts/test-phase-b-ui.mjs
          node --check timeline.js
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add timeline.js timeline.html
          git commit -m "feat: personalize timeline discovery"
          git push
