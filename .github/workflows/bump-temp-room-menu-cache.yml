name: Bump Temporary Rooms menu cache

on:
  push:
    paths:
      - '.github/workflows/bump-temp-room-menu-cache.yml'

permissions:
  contents: write

jobs:
  bump-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump service worker cache
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('sw.js')
          s = p.read_text()
          old = 'const CACHE_NAME = "anonchat-v146";'
          new = 'const CACHE_NAME = "anonchat-v147";'
          if old not in s:
              raise SystemExit('Expected v146 cache marker not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit cache bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sw.js
          git commit -m "Bump cache for Temporary Rooms menu encryption gate"
          git push
