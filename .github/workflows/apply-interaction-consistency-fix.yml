name: Apply interaction consistency fix

on:
  push:
    branches:
      - fix/timeline-interaction-consistency-heart
    paths:
      - .interaction-fix-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/timeline-interaction-consistency-heart
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-interaction-consistency-fix.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add timeline.js profile.js scripts/test-timeline-moderation-ui.mjs
          git commit -m "fix: align timeline interaction loading and add heart reaction"
          git push origin HEAD:fix/timeline-interaction-consistency-heart
