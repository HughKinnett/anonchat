<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <link rel="stylesheet" href="timeline.css">
  <title>Community — AnonChat</title>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="timeline.html">AnonChat</a>
    <div class="topbar-actions">
      <a class="secondary-button" href="communities.html">Communities</a>
      <button id="community-detail-sign-out" class="secondary-button" type="button">Sign Out</button>
    </div>
  </header>

  <main class="page-shell">
    <header class="connections-heading">
      <p class="eyebrow">Community</p>
      <h1 id="community-detail-title">Loading…</h1>
      <p id="community-detail-description"></p>
      <p id="community-detail-members"></p>
      <p id="community-detail-status" role="status" aria-live="polite"></p>
    </header>

    <section class="connections-panel" aria-labelledby="community-rules-title">
      <h2 id="community-rules-title">Community rules</h2>
      <ol id="community-detail-rules"></ol>
    </section>

    <section class="connections-panel" aria-labelledby="community-compose-title">
      <h2 id="community-compose-title">Post to this Community</h2>
      <form id="community-post-composer">
        <textarea id="community-post-content" maxlength="500" rows="4" placeholder="Share something with this Community" required></textarea>
        <button type="submit">Post</button>
      </form>
    </section>

    <section class="connections-panel" aria-labelledby="community-posts-title">
      <h2 id="community-posts-title">Posts</h2>
      <div id="community-posts-list"></div>
    </section>
  </main>

  <script type="module" src="community-detail.js"></script>
</body>
</html>
