<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <meta name="description" content="View an AnonChat user's pseudonymous profile and posts.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="AnonChat">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="timeline.css">
  <title>AnonChat — Profile</title>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="timeline.html">AnonChat</a>
    <div class="topbar-actions">
      <a class="secondary-button nav-button" href="timeline.html">← Timeline</a>
      <div class="main-menu"><button id="main-menu-button" class="menu-button" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="main-menu-panel"><span></span><span></span><span></span></button><nav id="main-menu-panel" class="main-menu-panel" hidden><a href="timeline.html">Timeline</a><a href="community.html">Community</a><a href="connections.html">Followers & following</a><button class="install-app menu-install" type="button">Install AnonChat</button><a class="menu-danger" href="delete-account.html">Delete account</a></nav></div>
    </div>
  </header>

  <main class="page-shell profile-page">
    <section class="view-profile-banner" aria-labelledby="profile-name">
      <img id="view-profile-cover" class="view-profile-cover" src="Untitled.jpeg" alt="">
      <div class="view-profile-content">
        <img id="view-profile-avatar" class="view-profile-avatar" src="Untitled.jpeg" alt="">
        <div class="view-profile-identity">
          <h1 id="profile-name">Loading profile…</h1>
          <p id="profile-handle"></p>
          <div class="profile-connections-links">
            <a id="profile-followers" href="connections.html">0 followers</a>
            <a id="profile-following" href="connections.html">0 following</a>
          </div>
          <a id="profile-admin-link" class="my-profile-link admin-link" href="admin.html" hidden>Admin dashboard</a>
        </div>
        <div id="profile-social-actions" class="profile-social-actions" hidden>
          <button id="profile-follow-button" class="follow-button" type="button" hidden>Follow</button>
          <select id="profile-report-reason" aria-label="Reason for reporting this user">
            <option value="harassment">Harassment</option>
            <option value="hate-threats">Hate or threats</option>
            <option value="sexual-content">Sexual content</option>
            <option value="spam-scam">Spam or scam</option>
            <option value="privacy-impersonation">Privacy or impersonation</option>
            <option value="other">Other</option>
          </select>
          <button id="profile-report-button" class="follow-button report-button" type="button">Report user</button>
          <button id="profile-block-button" class="secondary-button" type="button">Block user</button>
        </div>
      </div>
    </section>

    <section id="profile-spotify-card" class="spotify-profile-card profile-spotify-card" aria-labelledby="profile-spotify-title" hidden>
      <div class="spotify-card-heading"><div><p class="eyebrow">Profile soundtrack</p><h2 id="profile-spotify-title">Playing on Spotify</h2></div></div>
      <div id="profile-spotify-player"></div>
    </section>

    <section class="profile-posts-section" aria-labelledby="profile-posts-title">
      <div class="feed-header">
        <h2 id="profile-posts-title" class="section-title">Posts</h2>
        <span id="profile-post-count" class="follower-count"></span>
      </div>
      <p id="profile-status" role="status" aria-live="polite">Loading posts…</p>
      <ul class="feed" id="profile-feed"></ul>
    </section>
    <p class="install-help" role="status" aria-live="polite"></p>
  </main>

  <script type="module" src="profile.js"></script>
  <script src="nav-menu.js" defer></script>
  <script src="pwa.js" defer></script>
</body>
</html>
