<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="anonchat-anonymous.png">
  <link rel="stylesheet" href="profile.css">
  <link rel="stylesheet" href="profile-phase-a.css">
  <link rel="stylesheet" href="premium.css">
  <title>AnonChat — Profile</title>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="timeline.html">AnonChat</a>
    <div class="topbar-actions">
      <a class="secondary nav-button" href="timeline.html">← Timeline</a>
      <div class="main-menu">
        <button id="main-menu-button" class="menu-button" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="main-menu-panel"><span></span><span></span><span></span></button>
        <nav id="main-menu-panel" class="main-menu-panel" hidden>
          <a href="timeline.html">Timeline</a>
          <a href="community.html">Community</a>
          <a href="profile.html" aria-current="page">My profile</a>
          <a href="connections.html">Followers & following</a>
          <button class="install-app menu-install" type="button">Install AnonChat</button>
          <button id="sign-out" class="menu-danger" type="button">Sign out</button>
          <a class="menu-danger" href="delete-account.html">Delete account</a>
        </nav>
      </div>
    </div>
  </header>

  <main>
    <section class="profile-card">
      <img id="profile-photo" class="profile-photo" src="anonchat-anonymous.png" alt="Profile photo">
      <div class="profile-copy">
        <p class="eyebrow">AnonChat profile</p>
        <h1 id="profile-name">Loading profile…</h1>
        <p id="profile-bio" class="profile-bio"></p>
        <div id="profile-connections" class="profile-connections-links" data-profile-private-hidden="false"></div>
        <div class="profile-actions">
          <button id="follow-button" class="primary" type="button" hidden>Follow</button>
          <button id="block-user" class="secondary-button" type="button" hidden>Block</button>
          <button id="report-profile" class="secondary-button" type="button" hidden>Report</button>
          <button id="profile-share-button" class="secondary-button" type="button">Share</button>
          <button id="profile-qr-button" class="secondary-button" type="button">Profile QR</button>
          <button id="profile-badges-open" class="secondary-button" type="button" hidden>Badges</button>
        </div>
        <p id="profile-status" role="status" aria-live="polite"></p>
      </div>
    </section>

    <section id="profile-privacy-controls" class="profile-privacy-controls" hidden aria-labelledby="profile-privacy-title">
      <h2 id="profile-privacy-title">Profile privacy</h2>
      <label class="switch"><input type="checkbox" data-profile-privacy="showPosts"> Show posts on my profile</label>
      <label class="switch"><input type="checkbox" data-profile-privacy="showBadges"> Show badges on my profile</label>
      <label class="switch"><input type="checkbox" data-profile-privacy="showFollowersFollowing"> Show followers and following</label>
      <label class="switch"><input type="checkbox" data-profile-privacy="showActivity"> Show profile activity</label>
      <p id="profile-private-note" class="profile-private-note" hidden></p>
    </section>

    <section id="profile-spotify-card" data-profile-activity data-profile-private-hidden="true" class="spotify-profile-card profile-spotify-card" aria-labelledby="profile-spotify-title" hidden>
      <div class="spotify-card-heading"><div><p class="eyebrow">Profile soundtrack</p><h2 id="profile-spotify-title">Playing on Spotify</h2></div></div>
      <div id="profile-spotify-player"></div>
    </section>

    <section class="profile-posts-section" data-profile-private-hidden="false">
      <h2>Posts</h2>
      <div id="profile-posts"></div>
    </section>
  </main>

  <dialog id="profile-badges-collection-dialog" class="profile-badge-dialog">
    <div class="profile-badge-dialog-card">
      <button id="profile-badges-collection-close" class="secondary-button" type="button">Close</button>
      <p class="eyebrow">Achievements</p>
      <h2>Badges</h2>
      <div id="profile-badges-collection" class="profile-badges-collection"></div>
      <p id="profile-badges-collection-empty" class="profile-badges-empty" hidden>No badges earned yet.</p>
    </div>
  </dialog>

  <dialog id="profile-badge-dialog" class="profile-badge-dialog">
    <div class="profile-badge-dialog-card">
      <button id="profile-badge-dialog-close" class="secondary-button" type="button">Close</button>
      <img id="profile-badge-dialog-image" src="anonchat-anonymous.png" alt="">
      <p id="profile-badge-dialog-tier" class="eyebrow"></p>
      <h2 id="profile-badge-dialog-name"></h2>
      <p id="profile-badge-dialog-description"></p>
      <p id="profile-badge-dialog-requirement" class="muted"></p>
      <p id="profile-badge-dialog-earned" class="muted"></p>
    </div>
  </dialog>

  <dialog id="profile-qr-dialog" class="profile-qr-dialog">
    <div class="profile-qr-card">
      <button id="profile-qr-close" class="secondary-button" type="button" aria-label="Close profile QR">Close</button>
      <h2>AnonChat Profile QR</h2>
      <p>Scan to view profile</p>
      <div id="profile-qr-canvas" aria-label="Profile QR code"></div>
      <p id="profile-qr-url" class="profile-qr-url"></p>
    </div>
  </dialog>

  <script type="module" src="profile-bootstrap.js"></script>
  <script type="module" src="post-sharing.js"></script>
  <script src="nav-menu.js" defer></script>
  <script type="module" src="premium-menu.js"></script>
  <script type="module" src="online-followers.js"></script>
  <script src="pwa.js" defer></script>
  <script type="module" src="site-announcement.js"></script>
</body>
</html>
