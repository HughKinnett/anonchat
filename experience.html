<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d12"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="timeline.css"><link rel="stylesheet" href="premium.css"><title>Your AnonChat experience</title></head><body><header class="topbar"><a class="brand" href="timeline.html">AnonChat</a><a class="secondary-button nav-button" href="timeline.html">← Timeline</a></header><main class="premium-shell experience-shell"><section class="premium-hero"><p class="eyebrow">Fast. Private. Yours.</p><h1>Your experience</h1></section><form id="experience-form" class="premium-card experience-grid"><label class="experience-option"><input name="dataSaver" type="checkbox"><span><strong>Data Saver</strong><small>Load post photographs only when you choose.</small></span></label><label class="experience-option"><input name="compactMode" type="checkbox"><span><strong>Compact feed</strong><small>Fit more conversation on smaller screens.</small></span></label><label class="experience-option"><input name="largeText" type="checkbox"><span><strong>Larger text</strong></span></label><label class="experience-option"><input name="highContrast" type="checkbox"><span><strong>Higher contrast</strong></span></label><label class="experience-option"><input name="reducedMotion" type="checkbox"><span><strong>Reduce motion</strong></span></label><label class="experience-option"><input name="readableFont" type="checkbox"><span><strong>Highly readable font</strong></span></label><label class="experience-option"><input name="quietMode" type="checkbox"><span><strong>Quiet mode</strong><small>Silence optional interface sounds on this device.</small></span></label><div class="experience-save"><button type="submit">Save experience</button><p id="experience-status" role="status"></p></div></form><section class="premium-grid"><article class="premium-card"><h2>Your participation</h2><p id="streak-summary"></p><div id="streak-badges" class="badge-row"></div></article><article class="premium-card"><h2>Saved on this device</h2><p>Bookmarks are private.</p><ul id="local-bookmarks" class="local-bookmark-list"></ul></article><article class="premium-card"><h2>Local drafts</h2><p id="draft-summary">Drafts are restored automatically in the post composer.</p><button id="clear-drafts" type="button" class="danger-control">Clear local drafts</button></article><article class="premium-card"><h2>Share AnonChat</h2><p>Invite someone without creating tracking records.</p><button id="share-anonchat" type="button">Share AnonChat</button></article></section></main><script type="module" src="experience.js"></script><script src="pwa.js" defer></script></body></html>
