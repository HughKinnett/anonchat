<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <meta name="description" content="The AnonChat pseudonymous timeline.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="AnonChat">
  <meta name="format-detection" content="telephone=no">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="Untitled.jpeg">
  <link rel="stylesheet" href="timeline.css">
  <title>AnonChat — Timeline</title>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="timeline.html">AnonChat</a>
    <div class="topbar-search">
      <label class="sr-only" for="site-search">Search users or posts</label>
      <input id="site-search" type="search" placeholder="Search users or keywords" autocomplete="off" aria-controls="search-results" aria-expanded="false">
      <div id="search-results" class="search-results" hidden></div>
    </div>
    <div class="topbar-actions">
      <div class="notification-center">
        <button id="notification-button" class="notification-button" type="button" aria-label="Open notifications" aria-expanded="false" aria-controls="notification-panel">
          <span aria-hidden="true">🔔</span>
          <span id="notification-badge" class="notification-badge" hidden>0</span>
        </button>
        <section id="notification-panel" class="notification-panel" aria-label="Notifications" hidden>
          <div class="notification-panel-heading"><h2>Notifications</h2><button id="enable-alerts" class="notification-alerts-button" type="button">Enable phone alerts</button></div>
          <p class="notification-alerts-help">Phone alerts require browser permission. For iPhone, install AnonChat on the Home Screen first.</p>
          <ul id="notification-list" class="notification-list"></ul>
        </section>
      </div>
      <button class="install-app secondary-button" type="button">Install app</button>
      <button id="sign-out" class="secondary-button" type="button">Sign Out</button>
    </div>
  </header>

  <main class="page-shell">
    <section class="profile-banner" aria-labelledby="display-name">
      <input type="file" id="banner-upload" accept="image/*" hidden>
      <button class="banner-button" type="button" aria-label="Change banner" onclick="document.getElementById('banner-upload').click()">
        <img id="banner-pic" src="Untitled.jpeg" alt="">
      </button>
      <div class="profile-content">
        <input type="file" id="profile-upload" accept="image/*" hidden>
        <button class="avatar-button" type="button" aria-label="Change profile picture" onclick="document.getElementById('profile-upload').click()">
          <img id="profile-pic" src="Untitled.jpeg" alt="">
        </button>
        <div>
          <h1 id="display-name">User Name</h1>
          <div class="username-edit-row">
            <p id="user-handle">@username</p>
            <button id="edit-username" class="edit-username" type="button">Edit</button>
          </div>
          <div class="profile-links">
            <a id="my-profile-link" class="my-profile-link" href="profile.html">View profile</a>
            <a class="my-profile-link" href="community.html">Community hub</a>
            <a class="my-profile-link delete-account-link" href="delete-account.html">Delete account</a>
            <a id="admin-link" class="my-profile-link admin-link" href="admin.html" hidden>Admin dashboard</a>
          </div>
        </div>
      </div>
    </section>

    <div class="content-grid">
      <section class="composer-card" aria-labelledby="composer-title">
        <h2 id="composer-title">Post anonymously</h2>
        <form id="post-form">
          <label class="sr-only" for="post-content">Post content</label>
          <textarea name="post-content" id="post-content" maxlength="500" placeholder="What's happening? Tag someone with @username"></textarea>
          <div id="post-image-preview-wrap" class="post-image-preview-wrap" hidden>
            <img id="post-image-preview" alt="Selected post upload preview">
            <button id="remove-post-image" type="button" aria-label="Remove selected photo">Remove photo</button>
          </div>
          <div class="composer-footer">
            <label class="photo-upload-button" for="post-image-upload">📷 Add photo</label>
            <input id="post-image-upload" type="file" accept="image/*" hidden>
            <span>500 characters max</span>
            <button class="primary-button" type="submit">Post</button>
          </div>
        </form>
        <p id="timeline-status" role="status" aria-live="polite"></p>
        <p class="install-help" role="status" aria-live="polite"></p>
      </section>

      <section aria-labelledby="feed-title">
        <div class="feed-header">
          <h2 id="feed-title" class="section-title">Latest posts</h2>
          <div class="feed-tabs" aria-label="Choose posts to show">
            <button id="show-all-posts" class="feed-tab" type="button" aria-pressed="true">Timeline</button>
            <button id="show-profile-posts" class="feed-tab" type="button" aria-pressed="false">My profile</button>
          </div>
        </div>
        <ul class="feed" id="feed"></ul>
      </section>
    </div>
  </main>

  <script type="module" src="upload.js"></script>
  <script type="module" src="timeline.js"></script>
  <script src="pwa.js" defer></script>
</body>
</html>
