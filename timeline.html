<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="timeline.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AnonChat — Timeline</title>
</head>
<body>
  <header class="profile-banner">
    <h1 id="display-name">Loading…</h1>
    <p id="user-handle"></p>
    <button id="sign-out" type="button">Sign Out</button>
  </header>
  <main>
    <form id="post-form">
      <label for="post-content">Create a post</label>
      <textarea name="post-content" id="post-content" maxlength="500" placeholder="What's happening?" required></textarea>
      <button type="submit">Post</button>
    </form>
    <p id="timeline-status" role="status" aria-live="polite"></p>
    <ul class="feed" id="feed"></ul>
  </main>
  <script type="module" src="timeline.js"></script>
</body>
</html>
