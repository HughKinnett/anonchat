<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <link rel="stylesheet" href="login.css">
  <title>Reset password — AnonChat</title>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">AnonChat</a>
  </header>
  <main class="auth-shell">
    <section class="auth-card password-reset-card" aria-labelledby="reset-title">
      <img class="reset-brand-mark" src="anonchat-anonymous.png" alt="AnonChat anonymous logo">
      <h1 id="reset-title">Reset your password</h1>
      <p>Enter your account email twice. We’ll email a secure link where you can choose a new password.</p>
      <form id="password-reset-form">
        <label for="reset-email">Email</label>
        <input id="reset-email" type="email" autocomplete="email" required>
        <label for="confirm-reset-email">Enter email again</label>
        <input id="confirm-reset-email" type="email" autocomplete="email" required>
        <button class="primary-button" type="submit">Send reset link</button>
      </form>
      <p id="reset-status" role="status" aria-live="polite"></p>
      <a class="forgot-password" href="index.html">Back to sign in</a>
    </section>
  </main>
  <script type="module" src="forgot-password.js"></script>
</body>
</html>
