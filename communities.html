<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <link rel="stylesheet" href="timeline.css">
  <title>Communities — AnonChat</title>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="timeline.html">AnonChat</a>
    <div class="topbar-actions">
      <div class="main-menu">
        <button id="main-menu-button" class="menu-button" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="main-menu-panel"><span></span><span></span><span></span></button>
        <nav id="main-menu-panel" class="main-menu-panel" hidden><a href="timeline.html">Timeline</a></nav>
      </div>
      <button id="communities-sign-out" class="secondary-button" type="button">Sign Out</button>
    </div>
  </header>

  <main class="page-shell">
    <header class="connections-heading">
      <p class="eyebrow">Interest Communities</p>
      <h1>Find your people without giving up your privacy.</h1>
      <p>Browse public Communities, join the ones you care about, and keep your AnonChat identity separate from your real-world identity.</p>
      <p id="communities-status" role="status" aria-live="polite"></p>
    </header>

    <section class="connections-panel" aria-labelledby="discover-title">
      <div class="connections-heading">
        <h2 id="discover-title">Discover Communities</h2>
        <label for="community-search">Search</label>
        <input id="community-search" type="search" autocomplete="off" placeholder="Search communities, topics, or descriptions">
        <label for="community-topic-filter">Topic</label>
        <select id="community-topic-filter">
          <option value="">All topics</option>
        </select>
      </div>
      <div id="communities-list" class="connections-list" aria-live="polite"></div>
    </section>
  </main>

  <script src="nav-menu.js" defer></script>
  <script type="module" src="communities.js"></script>
</body>
</html>
